plugins { id 'com.android.application' }
android {
  namespace 'com.ironfront.assault'
  compileSdk 35
  defaultConfig {
    applicationId 'com.ironfront.assault'
    minSdk 23
    targetSdk 32
    versionCode 1
    versionName '1.0'
  }
  buildTypes { release { minifyEnabled false } }
  aaptOptions { noCompress 'wav' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
