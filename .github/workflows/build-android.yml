name: Build Shadow Strike APK
on:
  push:
    branches: [shadow-strike-android]
    paths:
      - '.github/workflows/build-android.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Compile and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK platform
        run: "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShadowStrike.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowStrike-APK
          path: ShadowStrike.apk
          if-no-files-found: error
      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shadow-strike-v1
          name: Shadow Strike v1.0 — Android
          body: 'Original offline side-scrolling action game for Android, three biomes, touch controls, immersive landscape.'
          files: ShadowStrike.apk
          make_latest: false
