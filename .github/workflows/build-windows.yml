name: Build SlideVoice Windows EXE
on:
  push:
    branches: [slidevoice-windows]
  workflow_dispatch:
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0 pillow==11.3.0
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Bundle Russian speech model
        run: python download_model.py
      - name: Create icon
        run: python make_icon.py
      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SlideVoice --icon assets/slidevoice.ico --add-data "models;models" --collect-all vosk --collect-all sounddevice --collect-submodules win32com --hidden-import pythoncom --hidden-import pywintypes --hidden-import cffi --hidden-import _cffi_backend slidevoice.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SlideVoice-Windows-exe
          path: dist/SlideVoice.exe
          if-no-files-found: error
          retention-days: 30
