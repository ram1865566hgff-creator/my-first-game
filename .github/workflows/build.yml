name: Build Iron Front Android
on:
  push:
    branches: [ironfront-reborn]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate illustrated environments and sound
        run: |
          python3 -m pip install --quiet Pillow
          ART_OUT="$GITHUB_WORKSPACE/app/src/main/assets" python3 gen_art.py
          find app/src/main/assets -type f | wc -l
      - name: Compile Android game
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare and upload APK
        run: cp app/build/outputs/apk/debug/app-debug.apk IronFront.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IronFront-APK
          path: IronFront.apk
          if-no-files-found: error
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ironfront-v1
          name: Iron Front — Android v1.0
          body: 'Native offline action platformer. Three illustrated zones, weapon pickups, responsive multitouch controls, several enemy types, three bosses, original music and sound effects.'
          files: IronFront.apk
          make_latest: false
