name: Build Bogatyr Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание файлов из репозитория
        uses: actions/checkout@v4

      - name: Настройка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Настройка Android SDK
        uses: android-actions/setup-android@v3

      - name: Установка пакетов Android SDK 34
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Настройка Node.js и Cordova
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Упаковка игры в Android-проект и сборка APK
        run: |
          npm install -g cordova
          cordova create app ru.bogatyr.game "Богатырь"
          cp index.html app/www/index.html
          cd app
          cordova platform add android@13.0.0
          cordova build android --debug

      - name: Выгрузка готового файла APK
        uses: actions/upload-artifact@v4
        with:
          name: Bogatyr-Android-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
