name: Build Bogatyr Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание файлов
        uses: actions/checkout@v4

      - name: Настройка Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Сборка Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          npm install -g cordova
          cordova create app ru.bogatyr.game "Bogatyr"
          cp index.html app/www/index.html
          cd app
          cordova platform add android
          cordova build android --debug

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: Bogatyr-Android-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
